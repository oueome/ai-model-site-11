<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Exclusive AI Pack</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0f0f0f;
      color:white;
      font-family:Arial,sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{
      max-width:500px;
      width:100%;
      background:#1b1b1b;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 0 30px rgba(255,0,150,0.2);
    }

    .hero{
      width:100%;
      height:320px;
      background:url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=1200&auto=format&fit=crop') center/cover;
    }

    .content{
      padding:30px;
      text-align:center;
    }

    h1{
      font-size:36px;
      margin-bottom:10px;
    }

    p{
      color:#bdbdbd;
      line-height:1.6;
      margin-bottom:25px;
    }

    .features{
      text-align:left;
      margin-bottom:30px;
    }

    .features li{
      margin-bottom:10px;
      list-style:none;
    }

    .price{
      font-size:42px;
      font-weight:bold;
      margin-bottom:25px;
      color:#ff4fd8;
    }

    .buy-btn{
      display:inline-block;
      text-decoration:none;
      background:#ff4fd8;
      color:white;
      padding:18px 40px;
      border-radius:14px;
      font-size:20px;
      font-weight:bold;
      transition:0.3s;
    }

    .buy-btn:hover{
      transform:scale(1.05);
    }

    .footer{
      margin-top:20px;
      font-size:14px;
      color:#777;
    }

  </style>
</head>

<body>

  <div class="card">

    <div class="hero"></div>

    <div class="content">

      <h1>Cyberpunk AI Pack</h1>

      <p>
        Exclusive premium AI photo set with ultra realistic images,
        cyberpunk aesthetics and HD quality.
      </p>

      <ul class="features">
        <li>✅ 50 premium photos</li>
        <li>✅ Full HD quality</li>
        <li>✅ Instant download</li>
        <li>✅ Exclusive content</li>
      </ul>

      <div class="price">9€</div>

      <a
        class="buy-btn"
        href="https://tipply.pl/twojprofil"
        target="_blank"
      >
        Kup teraz
      </a>

      <div class="footer">
        Instant access after payment
      </div>

    </div>

  </div>

</body>
</html>
